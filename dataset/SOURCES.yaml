# Rostrum dataset sources (spec 4.2). Read by scripts/download_sources.py.
#
# HUMAN STEP: open each `page_url`, then
#   1. copy the direct audio link into the matching `download_url`
#      (replace the literal string "TODO(human)");
#   2. save the licence statement shown on that page as a PDF or PNG into
#      dataset/provenance/ under the exact `provenance` filename below;
#   3. run `python scripts/download_sources.py`.
#
# Licence policy (spec 4.1, hard rules, enforced in code):
#   * `licence` must be non-empty and must quote what the page actually says.
#   * Any licence naming ND / NoDerivatives is refused: flawed versions are
#     derivative works.
#   * Anything from TED is refused outright (CC BY-NC-ND and no edits, [R8]).
#   * Never invent a URL or a licence status. Leave TODO(human) and ask.
#
# Field reference
#   id                    short source id, used as the raw subdirectory name
#   text_id               the text these readings share (envelope key)
#   tier                  gold | silver | bronze (spec 4.2)
#   page_url              the human-readable page the licence is stated on
#   licence               the licence text AS STATED ON THAT PAGE
#   licence_evidence_url  optional second URL backing the licence claim
#   provenance            filename under dataset/provenance/ holding the PDF/screenshot
#   files[]               one entry per audio file:
#       file_id           dataset-wide unique id; becomes the WAV stem
#       reader            speaker/reader name as credited on the page
#       download_url      direct link to the audio asset ("TODO(human)" until filled)
#       excerpt_start_s   trim start in the *downloaded* file; null = from the beginning
#       excerpt_end_s     trim end; null = to the end
#       notes             optional, free text

