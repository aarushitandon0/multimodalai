# Montreal Forced Aligner lives in its OWN conda environment.
#
# Why separate: MFA pins Kaldi, OpenFst, pynini and an older numpy/scipy stack
# through conda-forge. Installing it beside librosa/torch/streamlit reliably
# breaks one side or the other. Rostrum therefore shells out:
#
#     conda run -n mfa mfa align <corpus> english_us_arpa english_us_arpa <out>
#
# (see configs/paths.yaml -> mfa, and src/rostrum/align/).
#
# Create / update:
#     make setup-mfa
#   or
#     conda env create -f environment.mfa.yml
#     conda run -n mfa mfa model download acoustic english_us_arpa
#     conda run -n mfa mfa model download dictionary english_us_arpa
#
# MFA is the only aligner used, for labels and at runtime (CLAUDE.md inv. 4).
# torchaudio.functional.forced_align is NOT an option: removed in torchaudio 2.9.
#
# Resolved: the Docker image (`make docker-build`) creates this env with
# micromamba on linux-64; montreal-forced-aligner 3.2.1 / pyhd8ed1ab_0 from
# conda-forge. There is still no conda on the Windows dev machine, so
# `make setup-mfa` is unverified there - use the container.

name: mfa
channels:
  - conda-forge
dependencies:
  - python=3.11
  # 3.2.1 verified: resolved by the conda-forge solver in the Docker build
  # (2026-10-11), `mfa version` prints 3.2.1.
  - montreal-forced-aligner=3.2.1
  # MFA 3.2.1 calls joblib.Memory(bytes_limit=...), which joblib 1.5 removed
  # (TypeError: Memory.__init__() got an unexpected keyword argument
  # 'bytes_limit' on `import montreal_forced_aligner`). Verified in the Docker
  # build: unpinned joblib breaks even `mfa version`.
  - joblib<1.5
  # MFA -> kalpy -> praatio imports pkg_resources, which setuptools removed in
  # 81 (ModuleNotFoundError: No module named 'pkg_resources'). Same pin as the
  # pip side keeps for sed_eval. Verified in the Docker build.
  - setuptools<81
  - sqlite
  - postgresql # MFA 3.x uses a local postgres for its corpus database
